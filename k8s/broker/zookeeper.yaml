apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper-deployment
  namespace: weather-station
  labels:
    app: zookeeper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.5.0
          ports:
            - containerPort: 2181
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"   

---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: weather-station
spec:
  selector:
    app: zookeeper # service is attached and forwards the requests to pods with this label
  ports:
    - protocol: TCP
      port: 2181 # service listens on this port
      targetPort: 2181 # service forwards the request to pod on this port