apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch-deployment
  namespace: weather-station
  labels:
    app: elasticsearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
        initContainers:
          - name: fix-permissions
            image: busybox:1.36
            command: [ "sh", "-c", "chown -R 1000:1000 /usr/share/elasticsearch/data" ]
            volumeMounts:
              - name: es-data
                mountPath: /usr/share/elasticsearch/data
        containers:
          - name: elasticsearch
            image: elasticsearch:8.12.0
            ports:
            - containerPort: 9200
            env:
              - name: discovery.type
                value: "single-node"
              - name: xpack.security.enabled
                value: "false"
              - name: ES_JAVA_OPTS
                value: "-Xms512m -Xmx512m"
              - name: cluster.routing.allocation.disk.threshold_enabled
                value: "false"
            resources:
              requests:
                memory: "1Gi"
                cpu: "500m"
              limits:
                memory: "2Gi"
                cpu: "1000m"

            volumeMounts:
              - mountPath: /usr/share/elasticsearch/data
                name: es-data
        volumes:
          - name: es-data
            persistentVolumeClaim:
              claimName: es-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: weather-station
spec:
  selector:
    app: elasticsearch # service is attached and forwards the requests to pods with this label
  ports:
    - protocol: TCP
      port: 9200 # service listens on this port
      targetPort: 9200 # service forwards the request to pod on this port