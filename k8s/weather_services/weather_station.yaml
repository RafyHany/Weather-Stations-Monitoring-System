apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: weather-station
  namespace: weather-station
  labels:
    app: weather-station
spec:
  serviceName: "weather-station-service"
  replicas: 10
  selector:
    matchLabels:
      app: weather-station
  template:
    metadata:
      labels:
        app: weather-station
    spec:
      volumes:
        - name: env-share
          emptyDir: {}

      initContainers:
        - name: extract-id
          image: busybox:1.36
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
                  
          command: ["sh", "-c", "echo export STATION_ID=$(echo $POD_NAME | grep -o '[0-9]*$') > /shared/.env"]
          volumeMounts:
            - name: env-share
              mountPath: /shared

      containers:
        - name: weather-station
          image: weather-station:1.0
          imagePullPolicy: Never
          command: ["sh", "-c", ". /shared/.env && java -jar app.jar station"]
          env:
            - name: KAFKA_BOOTSTRAP
              value: "kafka:29092"
          volumeMounts:
            - name: env-share
              mountPath: /shared