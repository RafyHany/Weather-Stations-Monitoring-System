apiVersion: apps/v1
kind: Deployment
metadata:
  name: rain-detector-deployment
  namespace: weather-station
  labels:
    app: rain-detector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rain-detector
  template:
    metadata:
      labels:
        app: rain-detector
    spec:
      containers:
        - name: rain-detector
          image: rain-detector:1.0
          imagePullPolicy: Never
          env:
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:29092"