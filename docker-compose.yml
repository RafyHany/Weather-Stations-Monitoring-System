services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - weather-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Maps out separate listeners for internal Docker communication and external host traffic
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - weather-network

  central-station:
    build: ./Centeral_Station
    image: central-station:1.0
    container_name: central-station
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    ports:
      - "8080:8080"
    volumes:
      - central_data:/app/data
    depends_on:
      - kafka
    networks:
      - weather-network

  x-station-template: &station-template
    build:
      context: ./weather-station
      dockerfile: Dockerfile.station
    image: weather-station:1.0
    depends_on:
      - kafka
    networks:
      - weather-network

  weather-station-1:
    <<: *station-template
    container_name: weather-station-1
    environment:
      - STATION_ID=1
      - KAFKA_BOOTSTRAP=kafka:29092

  weather-station-2:
    <<: *station-template
    container_name: weather-station-2
    environment:
      - STATION_ID=2
      - KAFKA_BOOTSTRAP=kafka:29092

  weather-station-3:
    <<: *station-template
    container_name: weather-station-3
    environment:
      - STATION_ID=3
      - KAFKA_BOOTSTRAP=kafka:29092

  weather-station-4:
    <<: *station-template
    container_name: weather-station-4
    environment:
      - STATION_ID=4
      - KAFKA_BOOTSTRAP=kafka:29092

  weather-station-5:
    <<: *station-template
    container_name: weather-station-5
    environment:
      - STATION_ID=5
      - KAFKA_BOOTSTRAP=kafka:29092

  weather-station-6:
    <<: *station-template
    container_name: weather-station-6
    environment:
      - STATION_ID=6
      - KAFKA_BOOTSTRAP=kafka:29092

  weather-station-7:
    <<: *station-template
    container_name: weather-station-7
    environment:
      - STATION_ID=7
      - KAFKA_BOOTSTRAP=kafka:29092

  weather-station-8:
    <<: *station-template
    container_name: weather-station-8
    environment:
      - STATION_ID=8
      - KAFKA_BOOTSTRAP=kafka:29092

  weather-station-9:
    <<: *station-template
    container_name: weather-station-9
    environment:
      - STATION_ID=9
      - KAFKA_BOOTSTRAP=kafka:29092

  weather-station-10:
    <<: *station-template
    container_name: weather-station-10
    environment:
      - STATION_ID=10
      - KAFKA_BOOTSTRAP=kafka:29092

  rain-detector:
    build:
      context: ./weather-station
      dockerfile: Dockerfile.detector
    image: rain-detector:1.0
    container_name: rain-detector
    environment:
      - KAFKA_BOOTSTRAP=kafka:29092
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - kafka
    networks:
      - weather-network

networks:
  weather-network:
    driver: bridge

volumes:
  central_data:
